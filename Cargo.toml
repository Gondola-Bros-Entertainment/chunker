[package]
name = "chunker"
version = "0.2.1"
edition = "2024"
description = "Split files into compressed chunks and publish incremental updates to S3 or Cloudflare R2"
license = "MIT"
repository = "https://github.com/Gondola-Bros-Entertainment/chunker"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
aws-sdk-s3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
hex = "0.4"
zstd = "0.14"
walkdir = "2"
chrono = "0.4"
anyhow = "1"
indicatif = "0.18"
futures = "0.3"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
