# cargo-about configuration for THIRD-PARTY-NOTICES (scripts/notices.py).

# A dependency whose license expression these cannot satisfy fails generation.
# Where a crate offers a choice, the first listed license is used. Apache-2.0
# leads because its text has no copyright line, so the canonical text is
# complete when a crate's own copy is not recognized.
accepted = ["Apache-2.0", "MIT", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib"]

# Matches the build matrix in .github/workflows/release.yml.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true

# Crates keep their license files at the package root. Deeper files are mostly
# sources whose license headers would be copied in as license texts.
max-depth = 1

# chunker itself is publish = false and is not third-party.
[private]
ignore = true

# AWS-LC's LICENSE lists the copyright notices for AWS-LC, BoringSSL, OpenSSL
# and the libraries compiled into it, then the license texts. The scanner does
# not recognize a combined file, so the clarification names it.
[aws-lc-sys.clarify]
license = "ISC AND (Apache-2.0 OR ISC) AND Apache-2.0 AND MIT AND BSD-3-Clause AND (Apache-2.0 OR ISC OR MIT) AND (Apache-2.0 OR ISC OR MIT-0)"

[[aws-lc-sys.clarify.files]]
path = "LICENSE"
checksum = "728536b4160e051f86d7c9c388f704866b3d512cd7df97ac3516c65279523c4e"

# aws-lc-rs's LICENSE holds the Apache-2.0 text and then the ISC license with
# Amazon's copyright notice.
[aws-lc-rs.clarify]
license = "ISC AND (Apache-2.0 OR ISC)"

[[aws-lc-rs.clarify.files]]
path = "LICENSE"
license = "ISC"
start = "Copyright Amazon.com, Inc. or its affiliates."
end = "OR IN CONNECTION WITH THE USE OR PERFORMANCE OF THIS SOFTWARE."
checksum = "3cc9b9267235c6c73f950b3189f33b3f6d3a6daf6fa07763843edd7a9a8b6b2e"

# base64-simd and vsimd are packaged without a license file. Their LICENSE is
# read from the repository at the commit each was published from.
[base64-simd.clarify]
license = "MIT"

[[base64-simd.clarify.git]]
path = "LICENSE"
checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d"

[vsimd.clarify]
license = "MIT"

[[vsimd.clarify.git]]
path = "LICENSE"
checksum = "71674605ec4c087fe9eb534e3e4f9e26eb2e4aabcd76a29fd156c6a844d44b3d"
