name: release
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag and prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          python3 - <<'PY'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert os.environ['REF_TYPE'] == 'tag' and os.environ['RELEASE_TAG'] == 'v' + version, 'Release must run from the matching version tag'
          text = pathlib.Path('CHANGELOG.md').read_text()
          notes = text.split('## ' + version + '\n', 1)[1].split('\n## ', 1)[0].strip()
          pathlib.Path('release-notes.md').write_text(notes + '\n')
          PY
      - name: Create or resume a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            python3 -c 'import json; assert json.load(open("release-state.json"))["isDraft"], "Release is already public"'
          else
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "Chunker $RELEASE_TAG" --notes-file release-notes.md
          fi
  build:
    needs: prepare
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            binary: target/release/chunker
            asset: chunker-linux-x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: target/release/chunker.exe
            asset: chunker-windows-x64.exe
          - os: macos-15
            target: aarch64-apple-darwin
            binary: target/release/chunker
            asset: chunker-macos-arm64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Verify runner architecture
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: rustc -vV | grep -Fx "host: $EXPECTED_TARGET"
      - name: Check format, lint, build and regression tests
        shell: bash
        run: bash scripts/check.sh
      - name: Sign and verify macOS executable
        if: runner.os == 'macOS'
        run: |
          codesign --force --sign - target/release/chunker
          codesign --verify --strict target/release/chunker
          target/release/chunker --version
      - name: Prepare executable and checksum
        env:
          BINARY: ${{ matrix.binary }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, shutil
          asset = pathlib.Path(os.environ['ASSET'])
          shutil.copy2(os.environ['BINARY'], asset)
          pathlib.Path(str(asset) + '.sha256').write_text(hashlib.sha256(asset.read_bytes()).hexdigest() + '  ' + asset.name + '\n')
          PY
      - name: Upload to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          ASSET: ${{ matrix.asset }}
        shell: bash
        run: gh release upload "$RELEASE_TAG" "$ASSET" "$ASSET.sha256" --clobber
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Publish after all platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" --json assets,isDraft > release-state.json
          python3 - <<'PY'
          import json
          state = json.load(open('release-state.json'))
          names = {'chunker-linux-x64', 'chunker-windows-x64.exe', 'chunker-macos-arm64'}
          expected = names | {name + '.sha256' for name in names}
          assert state['isDraft'] and {a['name'] for a in state['assets']} == expected
          assert all(a['size'] > 0 for a in state['assets'])
          PY
          gh release edit "$RELEASE_TAG" --draft=false --latest
